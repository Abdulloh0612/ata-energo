    Для проверки запросов выполните POST /auth/login и вставьте `Bearer <access>` в Authorize. Для локальных агентов используется X-Agent-Token.
    Deye Cloud: получите локальный ID через GET /deye/accounts, проверьте подключение через POST /deye/accounts/{id}/test и откройте GET /deye/accounts/{id}/stations. Для телеметрии нужен ID подключённого модема из GET /modems.
