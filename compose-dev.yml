# Ата Энерго: сервер (API + WebSocket), PostgreSQL, Redis, MQTT-брокер
#
#   docker compose up -d --build     # собрать и запустить
#   docker compose logs -f app       # логи приложения
#   docker compose down              # остановить (данные БД и MQTT сохраняются в volumes)
#
# API:     http://127.0.0.1:8000/api/health
# Swagger: http://127.0.0.1:8000/swagger/index.html
# MQTT:    <IP_сервера>:1883 (топик inverter/<SN>/data)
# Настройки — в .env (пример: .env.example).

services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      target: production
    container_name: ata-energo
    restart: always
    env_file:
      - .env
    environment:
      TZ: ${TIME_ZONE:-Asia/Bishkek}
      SERVER_PORT: "8000"
      HD_SECURE_COOKIE: ${HD_SECURE_COOKIE:-0}
      DATABASE_URL: postgres://${POSTGRES_USER:-ata}:${POSTGRES_PASSWORD:-ata}@database:5432/${POSTGRES_DB:-ata_energo}?sslmode=disable
      REDIS_ADDR: cache:6379
      REDIS_URL: redis://cache:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_BROKER_URL: tcp://mqtt:1883
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./hybrid-doctor/data:/usr/bin/app/hybrid-doctor/data
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      mqtt:
        condition: service_started
    mem_limit: 512m
    networks:
      - ata-energo-network

  database:
    image: postgres:16-alpine
    container_name: ata-energo-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ata}
      POSTGRES_DB: ${POSTGRES_DB:-ata_energo}
      TZ: ${TIME_ZONE:-Asia/Bishkek}
      PGTZ: ${TIME_ZONE:-Asia/Bishkek}
    volumes:
      - postgres-data-main:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ata} -d ${POSTGRES_DB:-ata_energo}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks:
      - ata-energo-network

  cache:
    image: redis:7-alpine
    container_name: ata-energo-redis
    restart: always
    command: >
      sh -c '
      if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      else
        exec redis-server --appendonly yes
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TIME_ZONE:-Asia/Bishkek}
    volumes:
      - redis-data-main:/data
    healthcheck:
      test: >
        sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG
        else
          redis-cli ping | grep -q PONG
        fi'
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    networks:
      - ata-energo-network

  # MQTT-брокер для модемов (топик inverter/<SN>/data). Порт 1883 открыт наружу — модемы шлют сюда.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ata-energo-mqtt
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    mem_limit: 128m
    networks:
      - ata-energo-network

volumes:
  postgres-data-main:
  redis-data-main:
  mosquitto-data:
  mosquitto-log:

networks:
  ata-energo-network: